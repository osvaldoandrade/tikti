name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/version to release (e.g. v0.2.1 or 0.2.1)."
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          fi
          # Allow "0.2.2" as input and normalize to "v0.2.2".
          if [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tag="v${tag}"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+$ ]]; then
            echo "Invalid tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.vars.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          CMDS="tikti tikti-cli tikti-migrate"
          for cmd in $CMDS; do
            for GOOS in linux darwin windows; do
              for GOARCH in amd64 arm64; do
                ext=""
                if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
                echo "Building $cmd $GOOS/$GOARCH"
                CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
                  go build -trimpath -ldflags "-s -w" \
                  -o "dist/${cmd}-${GOOS}-${GOARCH}${ext}" \
                  "./cmd/${cmd}"
              done
            done
          done

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          shasum -a 256 dist/* > dist/SHA256SUMS.txt

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@osvaldoandrade"

      - name: Publish npm package (GitHub Packages)
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.vars.outputs.tag }}"
          ver="${tag#v}"
          cd npm/tikti-cli
          npm version "$ver" --no-git-tag-version
          npm publish
