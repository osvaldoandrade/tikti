port: 8080
redisAddr: ${REDIS_ADDR}
redisDb: 0
redisPassword: ${REDIS_PASSWORD}
jwtSecret: ${JWT_SECRET}
apiKey: ${API_KEY}
issuerBaseUrl: ${ISSUER_BASE_URL}
defaultAudience: ${DEFAULT_AUDIENCE}
jwksPrivateKey: ${JWKS_PRIVATE_KEY}
jwksKeyId: ${JWKS_KEY_ID}
tenantScopedTokenClaimsV1: false
tenantScopedTokenClaimsV1Tenants: []
exactMembershipReadRoutesV1: false
exactMembershipReadRoutesV1Tenants: []
workloadIdentity:
  issuer: ${WORKLOAD_IDENTITY_ISSUER}
  audience: tikti-workload-exchange
  jwksUrl: ${WORKLOAD_IDENTITY_JWKS_URL}
  httpTimeoutSeconds: 5
  jwksCacheTtlSeconds: 300
  accessTokenTtlSeconds: 300

