{{- if .Values.config.storageSTS.enabled }}
{{- if not (regexMatch `^[0-9]{12}$` .Values.config.storageSTS.syntheticAccountId) }}{{ fail "config.storageSTS.syntheticAccountId must contain exactly 12 digits" }}{{- end }}
{{- if not (regexMatch `^https?://[^/?#]+/internal/v1/object-storage:authorize$` .Values.config.storageSTS.authorizerUrl) }}{{ fail "config.storageSTS.authorizerUrl must be the exact internal endpoint" }}{{- end }}
{{- if not (regexMatch `^https?://[^/?#]+/?$` .Values.config.storageSTS.minioStsEndpoint) }}{{ fail "config.storageSTS.minioStsEndpoint must be one exact origin" }}{{- end }}
{{- if not (regexMatch `^https?://[^/?#]+/internal/v1/storage/jwks\.json$` .Values.config.storageSTS.oidcJwksUrl) }}{{ fail "config.storageSTS.oidcJwksUrl must be the exact machine-only JWKS endpoint" }}{{- end }}
{{- if ne .Values.config.storageSTS.serviceSubject "tikti:object-storage-sts" }}{{ fail "config.storageSTS.serviceSubject must be exact" }}{{- end }}
{{- if ne (int .Values.config.storageSTS.credentialTtlSeconds) 900 }}{{ fail "config.storageSTS.credentialTtlSeconds must equal 900" }}{{- end }}
{{- if or (lt (int .Values.config.storageSTS.serviceAssertionTtlSeconds) 1) (gt (int .Values.config.storageSTS.serviceAssertionTtlSeconds) 60) }}{{ fail "config.storageSTS.serviceAssertionTtlSeconds must be at most 60" }}{{- end }}
{{- if or (lt (int .Values.config.storageSTS.dependencyTimeoutSeconds) 1) (gt (int .Values.config.storageSTS.dependencyTimeoutSeconds) 10) }}{{ fail "config.storageSTS.dependencyTimeoutSeconds is outside bounds" }}{{- end }}
{{- if or (lt (int .Values.config.storageSTS.maximumConcurrent) 1) (gt (int .Values.config.storageSTS.maximumConcurrent) 32) }}{{ fail "config.storageSTS.maximumConcurrent is outside bounds" }}{{- end }}
{{- if or (ne .Values.config.storageSTS.readOnlyPolicy "code-admin-object-readonly-v1") (ne .Values.config.storageSTS.readWritePolicy "code-admin-object-readwrite-v1") }}{{ fail "config.storageSTS policy names must be fixed" }}{{- end }}
{{- if not (regexMatch `^https://[^/?#]+/?$` .Values.config.issuerBaseUrl) }}{{ fail "config.issuerBaseUrl must be an exact HTTPS origin for storageSTS" }}{{- end }}
{{- if ne .Values.config.workloadIdentity.audience "tikti-workload-exchange" }}{{ fail "storageSTS requires the exact workload audience" }}{{- end }}
{{- if and (eq .Values.config.workloadIdentity.issuer "") (eq (len .Values.config.workloadIdentity.providers) 0) }}{{ fail "storageSTS requires workload identity verification" }}{{- end }}
{{- if and (ne .Values.config.workloadIdentity.issuer "") (or (eq .Values.config.workloadIdentity.clusterRef "") (eq .Values.config.workloadIdentity.jwksUrl "")) }}{{ fail "storageSTS legacy workload issuer requires clusterRef and jwksUrl" }}{{- end }}
{{- range .Values.config.workloadIdentity.providers }}
{{- if or (eq .clusterRef "") (eq .issuer "") (eq .jwksUrl "") }}{{ fail "storageSTS workload providers require clusterRef, issuer, and jwksUrl" }}{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.config.objectStorageBrowser.deleteEnabled (not .Values.config.objectStorageBrowser.enabled) }}{{ fail "config.objectStorageBrowser.deleteEnabled requires browser enabled" }}{{- end }}
{{- if .Values.config.objectStorageBrowser.enabled }}
{{- if not .Values.config.storageSTS.enabled }}{{ fail "config.objectStorageBrowser.enabled requires config.storageSTS.enabled" }}{{- end }}
{{- if not (regexMatch `^https?://[^/?#]+/internal/v1/object-storage/authorize-admin$` .Values.config.objectStorageBrowser.adminAuthorizerUrl) }}{{ fail "config.objectStorageBrowser.adminAuthorizerUrl must be the exact internal endpoint" }}{{- end }}
{{- if ne (int .Values.config.objectStorageBrowser.maximumPresignTtlSeconds) 60 }}{{ fail "config.objectStorageBrowser.maximumPresignTtlSeconds must equal 60" }}{{- end }}
{{- if or (eq (len .Values.config.objectStorageBrowser.cohortTenants) 0) (gt (len .Values.config.objectStorageBrowser.cohortTenants) 100) }}{{ fail "config.objectStorageBrowser.cohortTenants must contain 1 to 100 tenants" }}{{- end }}
{{- if ne (len (uniq .Values.config.objectStorageBrowser.cohortTenants)) (len .Values.config.objectStorageBrowser.cohortTenants) }}{{ fail "config.objectStorageBrowser.cohortTenants must contain unique tenants" }}{{- end }}
{{- range .Values.config.objectStorageBrowser.cohortTenants }}
{{- if or (gt (len .) 63) (not (regexMatch `^[a-z0-9]([-a-z0-9]*[a-z0-9])?$` .)) }}{{ fail "config.objectStorageBrowser.cohortTenants must contain canonical tenant IDs" }}{{- end }}
{{- end }}
{{- if ne .Values.config.defaultAudience "code-admin-api" }}{{ fail "config.objectStorageBrowser requires defaultAudience code-admin-api" }}{{- end }}
{{- if .Values.config.objectStorageBrowser.deleteEnabled }}
{{- if or (eq (len .Values.config.objectStorageBrowser.deleteCohortTenants) 0) (gt (len .Values.config.objectStorageBrowser.deleteCohortTenants) 100) }}{{ fail "config.objectStorageBrowser.deleteCohortTenants must contain 1 to 100 tenants" }}{{- end }}
{{- if ne (len (uniq .Values.config.objectStorageBrowser.deleteCohortTenants)) (len .Values.config.objectStorageBrowser.deleteCohortTenants) }}{{ fail "config.objectStorageBrowser.deleteCohortTenants must contain unique tenants" }}{{- end }}
{{- range .Values.config.objectStorageBrowser.deleteCohortTenants }}
{{- if not (has . $.Values.config.objectStorageBrowser.cohortTenants) }}{{ fail "config.objectStorageBrowser.deleteCohortTenants must be a subset of cohortTenants" }}{{- end }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tikti.fullname" . }}-config
  labels:
{{ include "tikti.labels" . | indent 4 }}
data:
  tikti.yaml: |
    port: {{ .Values.config.port }}
    redisAddr: {{ .Values.config.redisAddr | quote }}
    redisDb: {{ .Values.config.redisDb }}
    redisPassword: {{- if .Values.secrets.enabled }} "${REDIS_PASSWORD}"{{- else }} {{ .Values.config.redisPassword | quote }}{{- end }}
    jwtSecret: {{- if .Values.secrets.enabled }} "${JWT_SECRET}"{{- else }} {{ .Values.config.jwtSecret | quote }}{{- end }}
    apiKey: {{- if .Values.secrets.enabled }} "${API_KEY}"{{- else }} {{ .Values.config.apiKey | quote }}{{- end }}
    issuerBaseUrl: {{ .Values.config.issuerBaseUrl | quote }}
    defaultAudience: {{ .Values.config.defaultAudience | quote }}
    jwksPrivateKey: {{- if .Values.secrets.enabled }} "${JWKS_PRIVATE_KEY}"{{- else }} {{ .Values.config.jwksPrivateKey | quote }}{{- end }}
    jwksKeyId: {{ .Values.config.jwksKeyId | quote }}
    tenantScopedTokenClaimsV1: {{ .Values.config.tenantScopedTokenClaimsV1 }}
    tenantScopedTokenClaimsV1Tenants: {{ .Values.config.tenantScopedTokenClaimsV1Tenants | toJson }}
    exactMembershipReadRoutesV1: {{ .Values.config.exactMembershipReadRoutesV1 }}
    exactMembershipReadRoutesV1Tenants: {{ .Values.config.exactMembershipReadRoutesV1Tenants | toJson }}
    membershipV2WriteRoutesV1: {{ .Values.config.membershipV2WriteRoutesV1 }}
    membershipV2WriteRoutesV1Tenants: {{ .Values.config.membershipV2WriteRoutesV1Tenants | toJson }}
    workloadIdentity:
      clusterRef: {{ .Values.config.workloadIdentity.clusterRef | quote }}
      issuer: {{ .Values.config.workloadIdentity.issuer | quote }}
      audience: {{ .Values.config.workloadIdentity.audience | quote }}
      jwksUrl: {{ .Values.config.workloadIdentity.jwksUrl | quote }}
      jwksBearerTokenFile: {{ .Values.config.workloadIdentity.jwksBearerTokenFile | quote }}
      providers:
        {{- toYaml .Values.config.workloadIdentity.providers | nindent 8 }}
      httpTimeoutSeconds: {{ .Values.config.workloadIdentity.httpTimeoutSeconds }}
      jwksCacheTtlSeconds: {{ .Values.config.workloadIdentity.jwksCacheTtlSeconds }}
      accessTokenTtlSeconds: {{ .Values.config.workloadIdentity.accessTokenTtlSeconds }}
    workloadAccountBFF:
      enabled: {{ .Values.config.workloadAccountBFF.enabled }}
      clients:
        {{- toYaml .Values.config.workloadAccountBFF.clients | nindent 8 }}
    storageSTS:
      enabled: {{ .Values.config.storageSTS.enabled }}
      syntheticAccountId: {{ .Values.config.storageSTS.syntheticAccountId | quote }}
      authorizerUrl: {{ .Values.config.storageSTS.authorizerUrl | quote }}
      minioStsEndpoint: {{ .Values.config.storageSTS.minioStsEndpoint | quote }}
{{- if .Values.config.storageSTS.enabled }}
      oidcJwksUrl: {{ .Values.config.storageSTS.oidcJwksUrl | quote }}
{{- end }}
      serviceSubject: {{ .Values.config.storageSTS.serviceSubject | quote }}
      credentialTtlSeconds: {{ .Values.config.storageSTS.credentialTtlSeconds }}
      serviceAssertionTtlSeconds: {{ .Values.config.storageSTS.serviceAssertionTtlSeconds }}
      dependencyTimeoutSeconds: {{ .Values.config.storageSTS.dependencyTimeoutSeconds }}
      maximumConcurrent: {{ .Values.config.storageSTS.maximumConcurrent }}
      readOnlyPolicy: {{ .Values.config.storageSTS.readOnlyPolicy | quote }}
      readWritePolicy: {{ .Values.config.storageSTS.readWritePolicy | quote }}
    objectStorageBrowser:
      enabled: {{ .Values.config.objectStorageBrowser.enabled }}
      adminAuthorizerUrl: {{ .Values.config.objectStorageBrowser.adminAuthorizerUrl | quote }}
      maximumPresignTtlSeconds: {{ .Values.config.objectStorageBrowser.maximumPresignTtlSeconds }}
      cohortTenants: {{ .Values.config.objectStorageBrowser.cohortTenants | toJson }}
      deleteEnabled: {{ .Values.config.objectStorageBrowser.deleteEnabled }}
      deleteCohortTenants: {{ .Values.config.objectStorageBrowser.deleteCohortTenants | toJson }}
    saml:
      enabled: {{ .Values.saml.enabled }}
      sp:
        entityID: {{ .Values.saml.sp.entityID | quote }}
        acsURL: {{ .Values.saml.sp.acsURL | quote }}
        sloURL: {{ .Values.saml.sp.sloURL | quote }}
        signingKeyPath: {{ .Values.saml.sp.signingKeyPath | quote }}
        signingCertPath: {{ .Values.saml.sp.signingCertPath | quote }}
        encryptionKeyPath: {{ .Values.saml.sp.encryptionKeyPath | quote }}
        encryptionCertPath: {{ .Values.saml.sp.encryptionCertPath | quote }}
        keyBits: {{ .Values.saml.sp.keyBits }}
        clockSkewSeconds: {{ .Values.saml.sp.clockSkewSeconds }}
        requestTTLSeconds: {{ .Values.saml.sp.requestTTLSeconds }}
        allowedSigAlgs: {{ .Values.saml.sp.allowedSigAlgs | toJson }}
        allowedDigestAlgs: {{ .Values.saml.sp.allowedDigestAlgs | toJson }}
        canonicalization: {{ .Values.saml.sp.canonicalization | quote }}
        requireAssertionSigned: {{ .Values.saml.sp.requireAssertionSigned }}
        requireEncryptedAssertion: {{ .Values.saml.sp.requireEncryptedAssertion }}
      acs:
        postLoginURL: {{ .Values.saml.acs.postLoginURL | quote }}
        deliveryMode: {{ .Values.saml.acs.deliveryMode | quote }}
        cookieName: {{ .Values.saml.acs.cookieName | quote }}
        cookieDomain: {{ .Values.saml.acs.cookieDomain | quote }}
        cookieSameSite: {{ .Values.saml.acs.cookieSameSite | quote }}
        cookieSecure: {{ .Values.saml.acs.cookieSecure }}
        cookieHTTPOnly: {{ .Values.saml.acs.cookieHTTPOnly }}
        sessionTTL: {{ .Values.saml.acs.sessionTTL }}
      idp:
        metadataURL: {{ .Values.saml.idp.metadataURL | quote }}
        metadataPath: {{ .Values.saml.idp.metadataPath | quote }}
        refreshIntervalHours: {{ .Values.saml.idp.refreshIntervalHours }}
        trustedCertPaths: {{ .Values.saml.idp.trustedCertPaths | toJson }}
        skipSignatureCheck: {{ .Values.saml.idp.skipSignatureCheck }}
      discover:
        enabled: {{ .Values.saml.discover.enabled }}
        protocolType: {{ .Values.saml.discover.protocolType | quote }}
        serviceURL: {{ .Values.saml.discover.serviceURL | quote }}
      metrics:
        enabled: {{ .Values.saml.metrics.enabled }}
        namespace: {{ .Values.saml.metrics.namespace | quote }}
