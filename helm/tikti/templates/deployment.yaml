apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tikti.fullname" . }}
  labels:
{{ include "tikti.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tikti.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
{{ include "tikti.labels" . | indent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
{{ toYaml . | indent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "tikti.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: tikti
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
{{ toYaml . | indent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            {{- if .Values.secrets.enabled }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "tikti.fullname" . }}-secrets
                  key: jwtSecret
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tikti.fullname" . }}-secrets
                  key: apiKey
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tikti.fullname" . }}-secrets
                  key: redisPassword
            - name: JWKS_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tikti.fullname" . }}-secrets
                  key: jwksPrivateKey
            {{- end }}
            {{- with .Values.extraEnv }}
{{ toYaml . | indent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
{{ toYaml . | indent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/etc/tikti.yaml
              subPath: tikti.yaml
            {{- if .Values.saml.enabled }}
            - name: saml-keys
              mountPath: /etc/tikti/saml
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
{{ toYaml . | indent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "tikti.fullname" . }}-config
        {{- if .Values.saml.enabled }}
        - name: saml-keys
          secret:
            secretName: {{ .Values.saml.existingSecret | default (printf "%s-saml" (include "tikti.fullname" .)) }}
            defaultMode: 0400
        {{- end }}
        {{- with .Values.extraVolumes }}
{{ toYaml . | indent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
