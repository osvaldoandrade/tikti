nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/osvaldoandrade/tikti
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

command:
  - "/app/tikti"

args:
  - "-f"
  - "/app/etc/tikti.yaml"

serviceAccount:
  create: true
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
  hosts:
    - host: tikti.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

config:
  port: 8080
  redisAddr: "redis:6379"
  redisDb: 0
  redisPassword: ""
  jwtSecret: ""
  apiKey: ""
  issuerBaseUrl: ""
  defaultAudience: "tikti"
  jwksPrivateKey: ""
  jwksKeyId: "tikti-local-1"
  tenantScopedTokenClaimsV1: false
  tenantScopedTokenClaimsV1Tenants: []
  tenantTargetDiscoveryV2: false
  tenantTargetDiscoveryV2PrincipalTenants: []
  identityGroupsV1: false
  tenantRuntimeAuthorityV1: false
  http:
    allowedOrigins: []
    trustedProxyCIDRs: []
    readHeaderTimeoutSeconds: 2
    readTimeoutSeconds: 5
    writeTimeoutSeconds: 10
    idleTimeoutSeconds: 60
    maxHeaderBytes: 1048576
    rateLimits:
      login: {requests: 5, windowSeconds: 60}
      oobSignIn: {requests: 10, windowSeconds: 60}
      tokenExchange: {requests: 10, windowSeconds: 60}
      lookup: {requests: 60, windowSeconds: 60}
      oob: {requests: 3, windowSeconds: 3600}
      saml: {requests: 10, windowSeconds: 60}
  workloadIdentity:
    clusterRef: ""
    issuer: ""
    audience: "tikti-workload-exchange"
    jwksUrl: ""
    jwksBearerTokenFile: ""
    # Trust each workload cluster explicitly. The legacy single issuer fields
    # above remain supported for existing installations. GKE providers use
    # authentication: gcp with the container.googleapis.com JWKS endpoint.
    providers: []
    httpTimeoutSeconds: 5
    jwksCacheTtlSeconds: 300
    accessTokenTtlSeconds: 300
  workloadAccountBFF:
    enabled: false
    clients: []
  storageSTS:
    enabled: false
    syntheticAccountId: "000000000000"
    authorizerUrl: ""
    minioStsEndpoint: ""
    oidcJwksUrl: ""
    serviceSubject: "tikti:object-storage-sts"
    credentialTtlSeconds: 900
    serviceAssertionTtlSeconds: 60
    dependencyTimeoutSeconds: 3
    maximumConcurrent: 8
    readOnlyPolicy: "code-admin-object-readonly-v1"
    readWritePolicy: "code-admin-object-readwrite-v1"
  objectStorageBrowser:
    enabled: false
    adminAuthorizerUrl: ""
    maximumPresignTtlSeconds: 60
    cohortTenants: []
    deleteEnabled: false
    deleteCohortTenants: []

secrets:
  enabled: true
  # The chart never manufactures authentication credentials. Installations
  # must provide this Secret (or explicitly override the name).
  existingSecret: "tikti-runtime"
  jwtSecret: ""
  apiKey: ""
  redisPassword: ""
  jwksPrivateKey: ""
  samlSpPrivateKey: ""
  samlSpCertificate: ""

saml:
  enabled: true
  existingSecret: ""
  # Platform authority may only originate from the immutable MASTER tenant.
  # Each entry is an exact lowercase identity; keep this list empty unless the
  # installation intentionally delegates platform administration through SAML.
  platformAdministrators: []
  sp:
    key: ""
    crt: ""
    entityID: ""
    acsURL: ""
    sloURL: ""
    signingKeyPath: /etc/tikti/saml/sp.key
    signingCertPath: /etc/tikti/saml/sp.crt
    encryptionKeyPath: ""
    encryptionCertPath: ""
    keyBits: 2048
    clockSkewSeconds: 120
    requestTTLSeconds: 300
    allowedSigAlgs:
      - rsa-sha256
    allowedDigestAlgs:
      - sha256
    canonicalization: "xml-exc-c14n"
    requireAssertionSigned: true
    requireEncryptedAssertion: false
  acs:
    postLoginURL: /dashboard
    deliveryMode: cookie
    cookieName: tikti_idt
    cookieDomain: ""
    cookieSameSite: Lax
    cookieSecure: true
    cookieHTTPOnly: true
    sessionTTL: 3600
  idp:
    metadataURL: ""
    metadataPath: ""
    refreshIntervalHours: 24
    trustedCertPaths: []
    skipSignatureCheck: false
  discover:
    enabled: false
    protocolType: ""
    serviceURL: ""
  metrics:
    enabled: true
    namespace: tikti
