nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/osvaldoandrade/tikti
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

command:
  - "/app/tikti"

args:
  - "-f"
  - "/app/etc/tikti.yaml"

serviceAccount:
  create: true
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
  hosts:
    - host: tikti.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

config:
  port: 8080
  redisAddr: "redis:6379"
  redisDb: 0
  redisPassword: ""
  jwtSecret: ""
  apiKey: ""
  issuerBaseUrl: ""
  defaultAudience: "tikti"
  jwksPrivateKey: ""
  jwksKeyId: "tikti-local-1"

secrets:
  enabled: true
  jwtSecret: ""
  apiKey: ""
  redisPassword: ""
  jwksPrivateKey: ""

saml:
  enabled: false
  # existingSecret: name of a pre-existing Secret containing sp.key and sp.crt.
  # When set, no Secret is rendered by this chart (use external-secrets or Vault).
  existingSecret: ""
  sp:
    key: ""  # PEM PKCS#8 private key; inject via --set-file or existingSecret
    crt: ""  # PEM X.509 certificate; inject via --set-file or existingSecret
    entityID: ""
    acsURL: ""
    sloURL: ""
    signingKeyPath: /etc/tikti/saml/sp.key
    signingCertPath: /etc/tikti/saml/sp.crt
    encryptionKeyPath: ""
    encryptionCertPath: ""
    keyBits: 2048
    clockSkewSeconds: 120
    requestTTLSeconds: 300
    allowedSigAlgs:
      - rsa-sha256
    allowedDigestAlgs:
      - sha256
    canonicalization: "xml-exc-c14n"
    requireAssertionSigned: true
    requireEncryptedAssertion: false
  acs:
    postLoginURL: /dashboard
    deliveryMode: cookie
    cookieName: tikti_idt
    cookieDomain: ""
    cookieSameSite: Lax
    cookieSecure: true
    cookieHTTPOnly: true
    sessionTTL: 3600
  idp:
    metadataURL: ""
    metadataPath: ""
    refreshIntervalHours: 24
    trustedCertPaths: []
    skipSignatureCheck: false
  discover:
    enabled: false
    protocolType: ""
    serviceURL: ""
  metrics:
    enabled: true
    namespace: tikti
